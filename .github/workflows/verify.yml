name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: client
      - run: npm run typecheck && npm test
        working-directory: worker
      - run: npm run typecheck && npm test
        working-directory: client
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r pipeline/requirements-test.txt
      - run: python -m unittest discover -s pipeline/tests -t . -v
        env:
          PYTHONPATH: pipeline/src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      - run: npm run test:e2e:integration
        working-directory: client
