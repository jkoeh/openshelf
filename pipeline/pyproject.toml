[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openshelf"
version = "0.1.0"
description = "Open source public domain audiobook platform"
requires-python = ">=3.12"

dependencies = [
    "kokoro",
    "misaki[zh]",
    "f5-tts",
    "chatterbox-tts",
    "soundfile",
    "numpy",
    "pydub",
    "ebooklib",
    "pypdf>=6.21.2,<7",
    "beautifulsoup4",
    "boto3",
    "anthropic",
    "openai",
    "psutil>=5.9",
    "pywebview>=6,<7; sys_platform == 'win32'",
    "python-dotenv",
    "torch",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
openshelf-pipeline = "openshelf.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openshelf.pipeline" = ["monitor/*.html", "monitor/*.css", "monitor/*.js"]
